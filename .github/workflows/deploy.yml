name: Deploy Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      - name: Create dual compatibility for Vercel and GitHub Pages
        run: |
          cp vercel.json dist/vercel.json
          mkdir -p dist/teacher-student-app
          cp -r dist/assets dist/teacher-student-app/
          cp dist/manifest.json dist/teacher-student-app/ 2>/dev/null || true
          cp dist/index.html dist/teacher-student-app/ 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
